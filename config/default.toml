[secrets]
jwt_secret     = { env = "YSH_JWT_SECRET", required = true }
db_password    = { env = "YSH_DB_PASSWORD", required = true }
encryption_key = { env = "YSH_ENCRYPTION_KEY", required = true }

[encryption]
algorithm = "aes-256-gcm"
nonce_strategy = "counter"
key_rotation_days = 30

[password]
algorithm = "argon2id"
memory_cost = 19456
time_cost = 2
parallelism = 1

[tls]
min_version = "1.3"
cert_path = { env = "YSH_TLS_CERT", required = true }
key_path  = { env = "YSH_TLS_KEY", required = true }

[jwt]
expiry_hours = 24
refresh_expiry_days = 30

[supervision.root]
strategy = "one_for_one"
max_restarts = 5
max_seconds = 10

[supervision.infrastructure]
strategy = "rest_for_one"
max_restarts = 3
max_seconds = 30

[supervision.services]
strategy = "one_for_all"
max_restarts = 2
max_seconds = 60

[supervision.security]
strategy = "one_for_one"
max_restarts = 3
max_seconds = 10

[server]
host = "0.0.0.0"
port = { env = "YSH_PORT", default = 8080, type = "u16" }
workers = 4
shutdown_timeout_secs = 30
static_dir = "./frontend/dist"   # dist del frontend WASM (se sirve en /)

[database]
url = { env = "YSH_DATABASE_URL", default = "sqlite://ysh.db" }
max_connections = 10
connect_timeout_secs = 5
query_timeout_secs = 30

[backpressure]
server_channel_size = 1024
database_channel_size = 256
webrtc_channel_size = 512

[rate_limit]
requests_per_second = 100
burst_size = 200

# ═══════════════════════════════════════════
# DDoS PROTECTION
# ═══════════════════════════════════════════
[ddos]
enabled = true
max_body_bytes = 1048576          # 1 MB
request_timeout_secs = 30
trusted_proxies = []              # e.g. ["127.0.0.1", "10.0.0.0/8"]

[ddos.rate_limit]
auth_max_per_minute = 5           # login, register, 2fa
api_max_per_minute = 60           # general endpoints
ws_max_per_minute = 30            # websocket messages
admin_max_per_minute = 120        # admin endpoints

[ddos.ip_block]
auto_block_threshold = 100        # errors in window
auto_block_window_secs = 60
auto_block_duration_secs = 300    # 5 min auto-ban
max_blocklist_size = 10000

[ddos.ws]
max_connections_per_user = 3
max_message_size_bytes = 65536    # 64 KB
heartbeat_timeout_secs = 60
message_rate_per_second = 10

# ═══════════════════════════════════════════
# CORS
# ═══════════════════════════════════════════
[cors]
allowed_origins = ["*"]           # restrict in production
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
max_age_secs = 3600

# ═══════════════════════════════════════════
# ECONOMY + STAKING
# ═══════════════════════════════════════════
[economy]
min_payout = 10
max_daily_spending = 100000
max_monthly_spending = 1000000
commission_tiers = 4
platform_fee_pct = 0.30

[economy.staking]
min_stake = 100
max_stake = 10000000
default_apy = 0.05
min_lock_days = 1
max_lock_days = 365
reward_calc_interval_hours = 24

[economy.commission]
tier1_pct = 0.40
tier2_pct = 0.20
tier3_pct = 0.10
tier4_pct = 0.05
min_purchase_for_commission = 100

[economy.fraud]
velocity_window_secs = 300
max_tx_per_window = 20
max_amount_per_window = 500000
large_tx_threshold = 10000
auto_freeze_on_fraud = true

[economy.call_billing]
min_cost_per_min = 1
default_cost_per_min = 5
host_earnings_pct = 0.70

# ═══════════════════════════════════════════
# BACKUP / SNAPSHOT
# ═══════════════════════════════════════════
[backup]
enabled = false
interval_secs = 3600
backup_dir = "./backups"
max_backups = 7
compact_before_backup = true

# ═══════════════════════════════════════════
# INTEGRITY CHECK
# ═══════════════════════════════════════════
[integrity]
check_on_startup = true
auto_repair = true

# ═══════════════════════════════════════════
# DATABASE ENCRYPTION AT REST
# ═══════════════════════════════════════════
[db_encryption]
enabled = false
key_env = "YSH_DB_KEY"
key_file = "./db_keyfile"
algorithm = "AES-256-GCM"

# ═══════════════════════════════════════════
# AI ENGINE (Motor de IA)
# ═══════════════════════════════════════════
[ai]
enabled = true
text_moderation_sensitivity = 0.6
text_moderation_flag_threshold = 0.45
anomaly_flag_threshold = 0.7
anomaly_std_devs = 3.0
matching_score_scale = 1.0
neural_input_size = 4
neural_hidden_size = 8
genetic_population_size = 50
genetic_generations = 30
genetic_mutation_rate = 0.1
annealing_start_temp = 10.0
annealing_cooling_factor = 0.995
annealing_iterations = 1000
annealing_step_size = 0.2
auto_report_on_block = true

# ═══════════════════════════════════════════
# MODERATION (FASE 13)
# ═══════════════════════════════════════════
[moderation]
auto_moderation_enabled = true
auto_moderate_moments = true
auto_moderate_chat = true
auto_flag_threshold = 0.30          # severity above which content is auto-flagged
auto_shadow_ban_after_reports = 5   # distinct reports before auto shadow ban
shadow_ban_duration_secs = 86400    # 24h default shadow ban
reports_to_action_threshold = 3

# ═══════════════════════════════════════════
# TRUST SCORE (FASE 13)
# ═══════════════════════════════════════════
[trust]
enabled = true
starting_score = 60.0
report_penalty = 8.0
flag_penalty = 5.0
shadow_ban_penalty = 25.0
ban_penalty = 40.0
badge_bonus = 10.0
account_age_bonus_max = 15.0

# ═══════════════════════════════════════════
# WEBRTC + STREAMING (FASE 8)
# ═══════════════════════════════════════════
[webrtc]
enabled = true
signal_mode = "sfu_passthrough"     # signaling relay, LiveKit/SFU-compatible
p2p_capacity = 2                    # P2P voz/video (1:1)
duo_capacity = 3                    # Duo calls (3 personas)
group_capacity = 8                  # Group calls (hasta 8 personas)
max_live_viewers = 1000             # Live streaming (1 a muchos)
cost_per_minute = 30                # coste base flash/p2p por minuto (débito wallet)
billing_per_second = true           # billing por duración
recording_enabled = true
recording_encryption = true         # metadata de grabación cifrada
simulcast_tiers = ["q", "h", "f"]   # low / high / full res
quality_chunk_interval = 5          # samples agregadas cada N chunk
flash_random = true
call_timeout_secs = 30

# ═══════════════════════════════════════════
# BACKGROUND JOBS (FASE 14)
# ═══════════════════════════════════════════
[jobs]
enabled = true
interval_secs = 60
payouts = true
staking = true
moderation = true
cleanup = true
notifications = true
analytics = true
moderation_auto_resolve_secs = 604800   # 7 días
moderation_dismiss_below = 0.4
moderation_action_above = 0.8
analytics_retention_days = 30
quality_retention_days = 7

# ═══════════════════════════════════════════
# FASE 15: ANALYTICS
# ═══════════════════════════════════════════
[analytics]
enabled = true
default_range_days = 30
snapshot_retention_days = 90

# ═══════════════════════════════════════════
# FASE 16: OBSERVABILITY (metrics + logging)
# ═══════════════════════════════════════════
# El formato de log se controla con YSH_LOG_JSON=1; la verbosidad con RUST_LOG.
[observability]
metrics_enabled = true          # expone /metrics en formato Prometheus
metrics_host = "0.0.0.0"        # bind del endpoint de métricas (127.0.0.1 si el
metrics_port = 9091             # scraper corre en la misma máquina)
snapshot_interval_secs = 15
