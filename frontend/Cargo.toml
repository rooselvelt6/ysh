[package]
name = "ysh-frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "HtmlFormElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Storage",
    "console",
] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
gloo-timers = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
