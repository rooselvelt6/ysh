# ═══════════════════════════════════════════
# YSH — Prometheus scrape config
# FASE 16: Deploy + Monitoring
# ═══════════════════════════════════════════
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ysh
    metrics_path: /metrics
    static_configs:
      - targets: ["ysh:9091"]
        labels:
          service: ysh

  # Métricas del propio Prometheus (opcional, útil para debugging)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
